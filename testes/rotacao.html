<!doctype html><!-- Teste de rotacao dos assets: erros de execucao em todas as culturas e angulos, e ordem das pecas contra a profundidade real. Rodar com testes/rotacao.py --><html><head><meta charset="utf-8"></head><body style="margin:0;background:#cdbb93"><canvas id="c"></canvas><script src="../app/gen.js"></script><script src="../app/assets.js"></script><script>window.OLD=window.AtlasAssets</script><script>
const NEW=AtlasAssets,RACES=["humano","anao","elfo","orc","deserto","norte","halfling","pantano","tribal","japones","chines","indiano","meso","mongol","eslavo","mediterraneo","bizantino","egipcio","celta","andino","gnomo","pirata","vapor"],IDS=Object.keys(NEW.SIZE).filter(k=>k!=="stairs"),T=.7;
const mk=()=>{const cv=document.createElement('canvas');cv.width=cv.height=360;return cv.getContext('2d',{willReadFrequently:true})};
const G1=mk(),G2=mk();
function shot(g,A,id,race,ang,v){g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,360,360);g.save();g.translate(180,260);g.scale(2,2);let e=null;try{A.draw(g,0,0,id,race,v==null?.6:v,ang)}catch(x){e=x.message}g.restore();g.setTransform(1,0,0,1,0,0);return e}
// 1. erros de execucao
window.erros=()=>{const E={};for(const id of IDS)for(const r of RACES)for(let a=0;a<8;a++)for(const v of[.2,.6,.9]){const e=shot(G1,NEW,id,r,a*Math.PI/4,v);if(e)E[id+"|"+r]=e}return E};
// 2. diferenca a 0 graus entre a versao antiga e a nova
window.dif0=(races)=>{const out=[];for(const id of IDS)for(const r of races){shot(G1,OLD,id,r,0);shot(G2,NEW,id,r,0);const a=G1.getImageData(0,0,360,360).data,b=G2.getImageData(0,0,360,360).data;let n=0,t=0;for(let i=0;i<a.length;i+=4){if(a[i+3]>30||b[i+3]>30){t++;if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])+Math.abs(a[i+3]-b[i+3])>60)n++}}if(n>0)out.push([id,r,n,+(n/t*100).toFixed(1)])}return out};
// 3. ordem das pecas contra a profundidade real (prisma de cada peca)
const yEm=(fp,x)=>{let a=1e9,b=-1e9;for(let i=0;i<fp.length;i++){const p=fp[i],q=fp[(i+1)%fp.length];if((p[0]-x)*(q[0]-x)>0)continue;const dx=q[0]-p[0];if(Math.abs(dx)<1e-9){a=Math.min(a,p[1],q[1]);b=Math.max(b,p[1],q[1])}else{const y=p[1]+(q[1]-p[1])*(x-p[0])/dx;if(y<a)a=y;if(y>b)b=y}}return a>b?null:[a,b]};
window.medir=(id,race,ang,v)=>{let cap=null;NEW.cena.gancho=o=>{if(!cap)cap=o};shot(G1,NEW,id,race,ang,v);NEW.cena.gancho=null;if(!cap||cap.L.length<2)return null;const L=cap.L,n=L.length,o0=cap.P(0,0),M=[];
  const rank=new Array(n);cap.ord.forEach((p,k)=>rank[p.i]=k);const dIn=(fp,x,y)=>{let c=false;for(let i=0,j=fp.length-1;i<fp.length;j=i++){const a=fp[i],b=fp[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c},BR=L.map(q=>{if(q.brota==null)return null;let mx=-1;for(const p of L)if(p!==q&&dIn(p.fp,q.cx,q.cyv))mx=Math.max(mx,rank[p.i]);return mx<0?null:{yb:260+2*(cap.P(q.u,q.v,q.brota)[1]+q.l*.2*T),rk:mx+.5}}),rk=(i,sy)=>BR[i]&&sy<BR[i].yb?Math.max(rank[i],BR[i].rk):rank[i];
  for(const p of L){G1.setTransform(1,0,0,1,0,0);G1.clearRect(0,0,360,360);G1.save();G1.translate(180,260);G1.scale(2,2);try{p.f&&p.f();for(const f of p.det)f()}catch(e){}G1.restore();const d=G1.getImageData(0,0,360,360).data,m=new Uint8Array(129600);for(let i=0;i<129600;i++)m[i]=d[i*4+3]>90?1:0;M.push(m)}
  let ov=0,eA=0,eD=0;for(let sy=0;sy<360;sy+=2)for(let sx=0;sx<360;sx+=2){const k=sy*360+sx;let c=0;for(let i=0;i<n;i++)c+=M[i][k];if(c<2)continue;const X=(sx-180)/2-o0[0],py=(sy-260)/2-o0[1];let best=-1,bd=-1e9,sec=-1e9,tA=-1,tD=-1;
    for(let i=0;i<n;i++){if(!M[i][k])continue;const p=L[i],r=yEm(p.fp,X);let d=p.cy;if(r){const lo=Math.max((py+p.z)/T,r[0]),hi=Math.min((py+p.z+p.h)/T,r[1]);d=lo<=hi?hi:(py+p.z>r[1]*T?r[1]:Math.max(r[0],Math.min(r[1],(py+p.z+p.h)/T)))}if(d>bd){sec=bd;bd=d;best=i}else if(d>sec)sec=d;if(tA<0||i>tA)tA=i;if(tD<0||rk(i,sy)>rk(tD,sy))tD=i}
    if(bd-sec<1.2)continue;ov++;if(tA!==best)eA++;if(tD!==best){eD++;if(window.__pts)window.__pts.push([sx,sy,best,tD])}}
  return {n,ov,eA,eD}};
window.medirTudo=(races)=>{const R=[];for(const id of IDS)for(const r of races){let ov=0,eA=0,eD=0,n=0,pior=0;for(let a=0;a<8;a++){const m=window.medir(id,r,a*Math.PI/4,.6);if(!m)continue;n=m.n;ov+=m.ov;eA+=m.eA;eD+=m.eD;pior=Math.max(pior,m.ov?m.eD/m.ov:0)}if(n)R.push([id,r,n,ov,eA,eD,+pior.toFixed(2)])}return R};
// folha de 8 angulos
window.sheet=function(ids,race,sc,cw,ch,old){const A=old?OLD:NEW,N=8,cv=document.getElementById('c');cv.width=N*cw+84;cv.height=ids.length*ch+22;const c=cv.getContext('2d');c.fillStyle="#b9b47a";c.fillRect(0,0,cv.width,cv.height);let err=[];c.fillStyle="#1d160d";c.font="bold 11px sans-serif";c.textAlign="center";
for(let a=0;a<N;a++)c.fillText((a*45)+"°",84+a*cw+cw/2,14);
ids.forEach((it,i)=>{const [id,rc,vv]=Array.isArray(it)?it:[it,race,.6];c.fillStyle="#1d160d";c.textAlign="left";c.font="bold 10px sans-serif";c.fillText((NEW.NAME[id]||id).slice(0,15),2,22+i*ch+ch/2);if(Array.isArray(it))c.fillText(rc,2,34+i*ch+ch/2);for(let a=0;a<N;a++){const x=84+a*cw+cw/2,y=22+i*ch+ch*.74;c.save();c.translate(x,y);c.scale(sc,sc);try{if(id.startsWith("ship:"))A.shipV(c,0,0,a*Math.PI/4,id.slice(5),1);else if(id.startsWith("big:")){AtlasGen.kit.drawBig(c,{k:+id.slice(4),x:0,y:0,race:rc,v:vv,sz:1,ang:a*Math.PI/4})}else A.draw(c,0,0,id,rc,vv,a*Math.PI/4)}catch(e){err.push(id+":"+e.message)}c.restore()}});return err}

window.dbg=(list)=>{const cv=document.getElementById('c');cv.width=list.length*360;cv.height=380;const c=cv.getContext('2d');c.fillStyle="#b9b47a";c.fillRect(0,0,cv.width,380);const out=[];list.forEach(([id,r,ai],k)=>{window.__pts=[];const m=window.medir(id,r,ai*Math.PI/4,.6);const pts=window.__pts;window.__pts=null;shot(G1,NEW,id,r,ai*Math.PI/4,.6);c.drawImage(G1.canvas,k*360,0);c.fillStyle="rgba(255,0,200,.75)";for(const [x,y] of pts)c.fillRect(k*360+x,y,2,2);c.fillStyle="#000";c.font="13px sans-serif";c.fillText(id+" "+r+" "+(ai*45)+"° err "+(m?m.eD+"/"+m.ov:"-"),k*360+6,372);const pr={};for(const [,,b,t] of pts){const kk=b+">"+t;pr[kk]=(pr[kk]||0)+1}out.push([id,ai,m,pr])});return out};
</script></body></html>
