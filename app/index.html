<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="menu" class="ghost" type="button" aria-label="Abrir lista">Lista</button>
    <div class="brand">Atlas<b>◆</b></div>
    <span id="sync" class="pill">Abrindo…</span>
    <span class="grow"></span>
    <label class="btn" for="imp">Importar .md</label><input type="file" id="imp" multiple accept=".md,.txt,.markdown" hidden>
    <button id="bPlay" type="button" class="ghost" aria-pressed="false" title="Na visão dos jogadores, os segredos do mestre ficam escondidos">Visão do mestre</button>
    <button id="bExp" type="button">Exportar</button>
  </header>
  <nav class="rail" aria-label="Seções">
    <button type="button" data-sec="notes">Notas</button>
    <button type="button" data-sec="maps">Mapas</button>
  </nav>
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <aside class="insp" id="insp" hidden></aside>
</div>
<div id="toast" role="status" hidden></div>
<script src="gen.js"></script>
<script src="assets.js"></script>
<script src="city.js"></script>
<script src="app.js"></script>
</body>
</html>
