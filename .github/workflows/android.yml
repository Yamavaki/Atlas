# Atlas - gera o app do Android (.apk) com o Tauri 2.
# Roda junto com o app do Windows (a cada versao, depois dele), a mao (Actions > "App do Android" > Run workflow) ou ao criar uma tag v*; anexa o .apk nos Releases.
# Assinatura: se os segredos ANDROID_KEYSTORE_B64 e ANDROID_KEY_PASSWORD existirem, o .apk sai assinado com a chave fixa
# (e cada versao nova instala por cima da anterior). Sem eles, sai uma versao de teste com chave temporaria.
name: App do Android

on:
  workflow_dispatch:
  workflow_call:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          ls "$ANDROID_NDK_LATEST_HOME" | head -3

      - name: Ferramenta do Tauri
        # instalada no projeto (nao global): o Gradle chama o tauri pelo caminho do node_modules
        run: |
          npm init -y >/dev/null
          npm pkg set scripts.tauri=tauri
          npm install -D @tauri-apps/cli@^2

      # 1.50: lista dos arquivos da interface (para a atualização sem reinstalar)
      - name: Lista da interface
        run: node scripts/web-json.mjs

      - name: Projeto Android
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/app-icon.png
          # permissao para o proprio app abrir o instalador de uma versao nova
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' $M
          # 1.51.3: volta do login do Google (esquema com.yamavaki.atlas) abre o app na mesma tela
          python3 - "$M" <<'PY'
          import sys,re
          p=sys.argv[1];s=open(p).read()
          if "com.yamavaki.atlas\"" not in s.split("<application")[1]:
              f='''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.yamavaki.atlas" />
                      </intent-filter>
                  </activity>'''
              s=s.replace("</activity>",f,1)
          s=re.sub(r'(<activity[^>]*?)android:launchMode="[^"]*"',r'\1',s,count=1)
          s=s.replace("<activity","<activity android:launchMode=\"singleTask\"",1)
          open(p,"w").write(s)
          PY
          cat $M
          # 1.51.1: atividade com margem das barras do sistema (status e gestos) e fundo escuro atras delas
          MA=$(find src-tauri/gen/android/app/src/main/java -name MainActivity.kt | head -1)
          { grep -m1 '^package ' "$MA"; cat src-tauri/android/MainActivity.kt; } > /tmp/MainActivity.kt && mv /tmp/MainActivity.kt "$MA"
          cat "$MA"

      - name: Montar o app
        # o Maven Central as vezes responde 429 (muitos pedidos): tenta de novo ate 3 vezes
        run: |
          for i in 1 2 3; do
            npx tauri android build --apk --target aarch64 --target armv7 --ci && exit 0
            echo "falhou (tentativa $i), esperando para tentar de novo"; sleep $((i*60))
          done
          exit 1

      - name: Assinar
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release-unsigned.apk" | head -1)
          echo "apk: $APK"
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VER=$V" >> $GITHUB_ENV
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > atlas.jks; PASS="$KS_PASS"; NOME="Atlas_${V}.apk"
          else
            PASS=teste123; NOME="Atlas_${V}_teste.apk"
            keytool -genkeypair -v -keystore atlas.jks -alias atlas -keyalg RSA -keysize 2048 -validity 10000 -storepass $PASS -keypass $PASS -dname "CN=Atlas teste"
          fi
          $BT/zipalign -p -f 4 "$APK" alinhado.apk
          $BT/apksigner sign --ks atlas.jks --ks-key-alias atlas --ks-pass pass:$PASS --key-pass pass:$PASS --out "$NOME" alinhado.apk
          rm -f atlas.jks
          $BT/apksigner verify "$NOME" && ls -la "$NOME"
          echo "APKNOME=$NOME" >> $GITHUB_ENV

      - name: Guardar o .apk
        uses: actions/upload-artifact@v4
        with:
          name: atlas-android
          path: ${{ env.APKNOME }}

      # so envia o arquivo para o Release da versao (sem editar o Release, que o build do Windows ja criou)
      - name: Publicar nos Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/web.json web.json
          gh release upload "v$VER" "$APKNOME" web.json --clobber -R "$GITHUB_REPOSITORY" \
            || gh release create "v$VER" "$APKNOME" web.json --prerelease --title "Atlas $VER" --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY"
