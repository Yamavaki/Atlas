# Atlas - gera o instalador do Windows (Tauri 2).
# Roda a mao (Actions > "App do Windows" > Run workflow) ou ao criar uma tag v* (ex.: v1.1.0), que tambem publica nos Releases.
name: App do Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Ferramenta do Tauri
        run: npm install -g @tauri-apps/cli@^2

      - name: Ícones
        run: tauri icon src-tauri/app-icon.png
        working-directory: .

      - name: Montar o app
        run: tauri build
        working-directory: src-tauri

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: atlas-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Versão
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "VER=$v" >> $env:GITHUB_ENV

      - name: Publicar nos Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Atlas ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Instalador do Atlas para Windows.
            - **Atlas_${{ env.VER }}_x64-setup.exe**: instalador comum (recomendado).
            - **.msi**: para instalar por política de empresa.
            O Windows pode avisar que o app não é de um editor conhecido (ainda não tem assinatura digital): clique em "Mais informações" e "Executar assim mesmo".
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # 1.49.5: o .apk do Android sai junto em toda versao (depois do Windows, para os dois nao criarem o Release ao mesmo tempo)
  android:
    needs: windows
    uses: ./.github/workflows/android.yml
    secrets: inherit
