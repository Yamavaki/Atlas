# Atlas - testes automaticos a cada envio: sintaxe de todos os arquivos JS e testes de unidade.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe
        run: |
          for f in $(find app -name "*.js" -not -path "app/vendor/*"); do node --check "$f" || exit 1; done
      - name: Testes de unidade
        run: node --test testes/unidade/*.test.*
