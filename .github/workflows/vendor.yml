# Atlas - monta as bibliotecas de fora (CodeMirror) e baixa as fontes para dentro do app (app/vendor/).
# Roda a mao em Actions > "Bibliotecas do app". Grava o resultado direto na main.
name: Bibliotecas do app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: CodeMirror
        working-directory: tools/vendor
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund esbuild @codemirror/state @codemirror/view @codemirror/commands @codemirror/language @codemirror/lang-markdown @codemirror/autocomplete @codemirror/search @lezer/markdown @lezer/highlight
          mkdir -p ../../app/vendor
          npx esbuild editor-entry.js --bundle --minify --format=iife --global-name=CM --outfile=../../app/vendor/codemirror.js --legal-comments=eof
          ls -la ../../app/vendor
      - name: Fontes
        working-directory: tools/vendor
        run: bash fontes.sh
      - name: Gravar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add app/vendor
          git commit -m "Bibliotecas do app: CodeMirror e fontes locais" || echo "nada mudou"
          git push
